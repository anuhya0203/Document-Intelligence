<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Intelligence - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { 
            background: white; 
            border-radius: 12px; 
            padding: 30px; 
            margin-bottom: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .header h1 { color: #333; margin-bottom: 10px; font-size: 32px; }
        .header p { color: #666; }
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 768px) { .main-content { grid-template-columns: 1fr; } }
        
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .card h2 { color: #333; margin-bottom: 20px; font-size: 20px; }
        
        .upload-area { 
            border: 3px dashed #667eea; 
            border-radius: 8px; 
            padding: 40px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s;
            background: #f8f9ff;
        }
        .upload-area:hover { 
            border-color: #764ba2; 
            background: #f0f2ff; 
        }
        .upload-area.dragover { 
            border-color: #764ba2; 
            background: #ede9ff; 
        }
        .upload-area p { color: #666; margin: 10px 0; }
        .upload-area .icon { font-size: 48px; margin-bottom: 15px; }
        
        input[type="file"] { display: none; }
        
        .form-group { margin: 20px 0; }
        label { display: block; margin-bottom: 10px; font-weight: 600; color: #333; }
        select { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #ddd; 
            border-radius: 6px; 
            font-size: 14px;
            transition: border-color 0.3s;
        }
        select:focus { outline: none; border-color: #667eea; }
        
        .btn { 
            padding: 14px 28px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .file-name { 
            margin: 15px 0; 
            padding: 12px; 
            background: #f0f2ff; 
            border-radius: 6px; 
            color: #333;
            text-align: center;
        }
        
        .progress { margin: 15px 0; }
        .progress-bar { 
            height: 6px; 
            background: #eee; 
            border-radius: 3px; 
            overflow: hidden; 
        }
        .progress-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%; 
            transition: width 0.3s; 
        }
        
        .documents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .doc-card { 
            border: 1px solid #eee; 
            border-radius: 8px; 
            padding: 20px; 
            transition: all 0.3s;
            cursor: pointer;
        }
        .doc-card:hover { 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            border-color: #667eea;
        }
        .doc-name { font-weight: 600; color: #333; margin-bottom: 10px; word-break: break-word; }
        .doc-meta { font-size: 13px; color: #999; margin-bottom: 8px; }
        .doc-status { 
            display: inline-block; 
            padding: 6px 12px; 
            border-radius: 4px; 
            font-size: 12px; 
            font-weight: 600;
            margin-top: 10px;
        }
        .status-pass { background: #d4edda; color: #155724; }
        .status-failed { background: #f8d7da; color: #721c24; }
        .status-pending { background: #fff3cd; color: #856404; }
        
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.5); 
            z-index: 1000; 
            align-items: center; 
            justify-content: center; 
        }
        .modal.show { display: flex; }
        .modal-content { 
            background: white; 
            border-radius: 12px; 
            width: 90%; 
            max-width: 800px; 
            max-height: 90vh; 
            overflow-y: auto; 
            padding: 30px; 
            position: relative;
        }
        .modal-close { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            font-size: 28px; 
            cursor: pointer; 
            color: #999;
        }
        .modal-close:hover { color: #333; }
        .modal-title { font-size: 22px; font-weight: 600; margin-bottom: 20px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { 
            padding: 12px 20px; 
            cursor: pointer; 
            font-weight: 500; 
            border: none; 
            background: none;
            color: #999;
            border-bottom: 3px solid transparent;
        }
        .tab.active { 
            color: #667eea; 
            border-bottom-color: #667eea;
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        
        .json-viewer { 
            background: #f5f5f5; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            padding: 15px; 
            overflow-x: auto; 
            font-family: 'Courier New', monospace; 
            font-size: 12px; 
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .validation-item { 
            margin: 15px 0; 
            padding: 15px; 
            border-left: 4px solid #ddd; 
            border-radius: 4px; 
        }
        .validation-item.pass { 
            border-left-color: #28a745; 
            background: #f0f8f4; 
        }
        .validation-item.fail { 
            border-left-color: #dc3545; 
            background: #fdf8f9; 
        }
        
        .empty-state { 
            text-align: center; 
            padding: 40px 20px; 
            color: #999;
        }
        .empty-state .icon { font-size: 64px; margin-bottom: 15px; }
        
        .alert { 
            padding: 15px; 
            border-radius: 6px; 
            margin-bottom: 20px; 
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .loading { 
            display: inline-block; 
            width: 12px; 
            height: 12px; 
            border: 2px solid #f3f3f3; 
            border-top: 2px solid #667eea; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 Document Intelligence</h1>
            <p>AI-powered document extraction and financial validation</p>
        </div>

        <div class="main-content">
            <!-- Upload Section -->
            <div class="card">
                <h2>Upload Document</h2>
                
                <div id="alert"></div>
                
                <form id="uploadForm">
                    <div class="form-group">
                        <label for="docType">Document Type</label>
                        <select id="docType" required>
                            <option value="">Select type...</option>
                            <option value="invoice">Invoice</option>
                            <option value="balance_sheet">Balance Sheet</option>
                            <option value="profit_and_loss">Profit & Loss</option>
                            <option value="cash_flow_statement">Cash Flow Statement</option>
                        </select>
                    </div>

                    <div class="upload-area" id="uploadArea">
                        <div class="icon">📁</div>
                        <p><strong>Drop file here or click</strong></p>
                        <p style="font-size: 12px;">PDF, JPG, PNG (max 3 pages, 20MB)</p>
                        <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png">
                    </div>

                    <div id="fileName" class="file-name" style="display: none;"></div>

                    <div class="progress" id="progressContainer" style="display: none;">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">Process Document</button>
                </form>
            </div>

            <!-- Documents List -->
            <div class="card">
                <h2>Recent Documents</h2>
                <div id="documentList">
                    <div class="empty-state">
                        <div class="icon">📋</div>
                        <p>No documents yet. Upload one to get started.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div class="modal-title" id="modalTitle"></div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab(event, 'extracted')">Extracted Data</button>
                <button class="tab" onclick="switchTab(event, 'validation')">Validation</button>
                <button class="tab" onclick="switchTab(event, 'json')">Raw JSON</button>
            </div>

            <div id="extracted" class="tab-pane active"></div>
            <div id="validation" class="tab-pane"></div>
            <div id="json" class="tab-pane"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://document-intelligence-trv0.onrender.com/api/v1';

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const uploadForm = document.getElementById('uploadForm');
        const alertContainer = document.getElementById('alert');

        // Upload handlers
        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files;
            updateFileName();
        });

        fileInput.addEventListener('change', updateFileName);

        function updateFileName() {
            if (fileInput.files.length > 0) {
                fileName.textContent = '✓ ' + fileInput.files[0].name;
                fileName.style.display = 'block';
            }
        }

        function showAlert(message, type) {
            alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!fileInput.files.length) {
                showAlert('Please select a file', 'error');
                return;
            }

            if (!document.getElementById('docType').value) {
                showAlert('Please select a document type', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('document_type', document.getElementById('docType').value);

            document.getElementById('submitBtn').disabled = true;
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('progressFill').style.width = '0%';

            try {
                const response = await fetch(`${API_BASE}/documents/process`, {
                    method: 'POST',
                    body: formData
                });

                document.getElementById('progressFill').style.width = '100%';

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Processing failed');
                }

                const result = await response.json();
                fileInput.value = '';
                fileName.style.display = 'none';
                document.getElementById('docType').value = '';
                document.getElementById('progressContainer').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;

                showAlert('Document processed successfully! ✅', 'success');
                loadDocuments();
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
                document.getElementById('progressContainer').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
            }
        });

        async function loadDocuments() {
            try {
                const response = await fetch(`${API_BASE}/documents?limit=10`);
                if (!response.ok) throw new Error('Failed to load documents');

                const data = await response.json();
                const list = document.getElementById('documentList');

                if (!data.documents || data.documents.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>No documents yet.</p></div>';
                    return;
                }

                list.innerHTML = data.documents.map(doc => `
                    <div class="doc-card" onclick="viewDetails('${doc.file_name}')">
                        <div class="doc-name">${doc.file_name}</div>
                        <div class="doc-meta">Type: ${doc.document_type}</div>
                        <div class="doc-meta">Status: ${doc.processing_status}</div>
                        <div class="doc-meta">Confidence: ${(doc.overall_confidence * 100).toFixed(0)}%</div>
                        <div class="doc-status ${doc.processing_status === 'PASS' ? 'status-pass' : 'status-failed'}">
                            ${doc.processing_status}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Load error:', error);
            }
        }

        async function viewDetails(fileName) {
            try {
                const response = await fetch(`${API_BASE}/documents/${encodeURIComponent(fileName)}`);
                if (!response.ok) throw new Error('Failed to load details');

                const d = await response.json();
                    document.getElementById('modalTitle').textContent = `📋 ${d.document_name}`;

                    // Extracted data
                    let html = '<div>';
                    if (d.extracted_data && Object.keys(d.extracted_data).length > 0) {
                        for (const [key, val] of Object.entries(d.extracted_data)) {
                            if (typeof val !== 'object') {
                                html += `<div style="margin: 10px 0;"><strong>${key}:</strong> ${val}</div>`;
                            }
                        }
                    } else {
                        html += '<p>No data extracted</p>';
                    }
                    html += '</div>';
                    document.getElementById('extracted').innerHTML = html;

                    // Validation
                    let valHtml = '';
                    if (d.validation && d.validation.checks) {
                        for (const check of d.validation.checks) {
                            const isPass = check.status === 'PASS';
                            valHtml += `
                                <div class="validation-item ${isPass ? 'pass' : 'fail'}">
                                    <strong>${check.name}</strong><br>
                                    Status: <span style="font-weight: 600;">${check.status}</span><br>
                                    ${check.formula ? `Formula: <code>${check.formula}</code><br>` : ''}
                                    ${check.calculated_value !== undefined ? `Calculated: ${check.calculated_value}<br>` : ''}
                                    ${check.reported_value !== undefined ? `Reported: ${check.reported_value}` : ''}
                                </div>
                            `;
                        }
                    }
                    document.getElementById('validation').innerHTML = valHtml || '<p>No validation checks</p>';

                    // JSON
                    document.getElementById('json').innerHTML = `<div class="json-viewer">${JSON.stringify(d, null, 2)}</div>`;

                    document.getElementById('detailModal').classList.add('show');
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        function switchTab(event, tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        // Load on start
        loadDocuments();
        setInterval(loadDocuments, 10000);
    </script>
</body>
</html>
